<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Shippitin — Rail Freight Booking & Multimodal Logistics</title>
    <meta name="description" content="Book CONCOR rail container freight across India and worldwide with Shippitin — plus sea, air, road, door-to-door, customs and cargo insurance. Instant quotes, documentation and live shipment tracking." />
    <meta name="keywords" content="rail freight, CONCOR, container booking, multimodal logistics, sea freight, air cargo, road freight, door to door, customs clearance, cargo insurance, shipment tracking, freight forwarding, India" />
    <meta name="author" content="Shippitin Logistics" />
    <meta name="theme-color" content="#065af3" />
    <link rel="canonical" href="https://www.shippitin.co/" />

    <!-- Open Graph — WhatsApp, LinkedIn, Facebook, Gmail link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shippitin" />
    <meta property="og:title" content="Shippitin — Rail Freight Booking & Multimodal Logistics" />
    <meta property="og:description" content="Book CONCOR rail container freight across India and worldwide — plus sea, air, road, door-to-door, customs and cargo insurance. Instant quotes, documentation and live shipment tracking." />
    <meta property="og:url" content="https://www.shippitin.co/" />
    <meta property="og:image" content="https://www.shippitin.co/images/homepage/hero-banner.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Shippitin — rail freight and multimodal logistics" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shippitin — Rail Freight Booking & Multimodal Logistics" />
    <meta name="twitter:description" content="Book CONCOR rail container freight across India and worldwide — plus sea, air, road, door-to-door, customs and cargo insurance. Instant quotes, documentation and live shipment tracking." />
    <meta name="twitter:image" content="https://www.shippitin.co/images/homepage/hero-banner.jpg" />

    <!-- Structured data — helps Google understand the entity (rich results / knowledge panel) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Shippitin",
      "legalName": "Shippitin Logistics",
      "url": "https://www.shippitin.co/",
      "logo": "https://www.shippitin.co/favicon.svg",
      "image": "https://www.shippitin.co/images/homepage/hero-banner.jpg",
      "description": "Shippitin is a logistics platform led by CONCOR rail container freight — book rail shipments across India and internationally, plus sea, air, road, door-to-door, customs clearance and cargo insurance, with instant quotes, documentation and live tracking.",
      "areaServed": "IN",
      "knowsAbout": ["Rail freight", "Container shipping", "CONCOR", "Sea freight", "Air cargo", "Road freight", "Door-to-door logistics", "Customs clearance", "Cargo insurance", "Freight forwarding", "Multimodal logistics"]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Shippitin",
      "url": "https://www.shippitin.co/"
    }
    </script>

    <link href="/src/index.css" rel="stylesheet">
    <link href="./output.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
